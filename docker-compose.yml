version: '3.8'

services:
  mail-redirector:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: mail-redirector
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
    volumes:
      - ./app/logs:/app/app/logs:rw
      - ./app/config:/app/app/config:ro
    networks:
      - mailnet
    healthcheck:
      test: ["CMD", "node", "-e", "console.log('Health check passed')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp

  # Optional: Monitoring service (uncomment if needed)
  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: prometheus
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #   networks:
  #     - mailnet
  #   restart: unless-stopped

  # Optional: Grafana for visualization (uncomment if needed)
  # grafana:
  #   image: grafana/grafana:latest
  #   container_name: grafana
  #   ports:
  #     - "3001:3000"
  #   environment:
  #     - GF_SECURITY_ADMIN_PASSWORD=admin
  #   volumes:
  #     - grafana-storage:/var/lib/grafana
  #   networks:
  #     - mailnet
  #   restart: unless-stopped

networks:
  mailnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# Optional: Grafana persistent storage (uncomment if using Grafana)
# volumes:
#   grafana-storage:
